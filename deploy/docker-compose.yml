# Agent X-Ray 单机部署(预发 130 / 生产境内轻量服务器共用)
#
# 镜像是**不可变制品**:本机构建 → 传输 → 服务器只 pull/load + up,服务器上不构建、
# 不保留任何构建工具链(CLAUDE.md 规则 10)。构建命令见 `dev.ps1 build`。
#
# 用法:
#   cp .env.example .env && chmod 600 .env    # 首次,填好后
#   IMAGE_TAG=<git-sha> docker compose up -d  # 或把 IMAGE_TAG 写进 .env
#
# ⚠️ `up -d` 之后必须跑一次 `./migrate.sh`。Encore 自托管镜像**不含迁移执行逻辑**
#    (实测 2026-08-29:库为空时 /health 仍 200,但 /agent/sessions 报
#    relation "sessions" does not exist —— 健康检查不会报警)。migrate.sh 幂等,
#    可安全重复执行;设计说明见 docs/deploy-environments.md「数据库迁移」。
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [front]
    depends_on:
      - web
      - api
    mem_limit: 128m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # 仅保留绑定 80/443 所需的一项能力
    cap_add: [NET_BIND_SERVICE]

  web:
    # Next.js standalone + bun 运行时(apps/web/Dockerfile)
    image: ${IMAGE_REGISTRY:-local}/xray-web:${IMAGE_TAG:?IMAGE_TAG 必须显式指定(git SHA),禁止 latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks: [front]
    mem_limit: 384m
    pids_limit: 128
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    # Encore.ts + pi SDK in-process,bun 运行时(encore build docker --base oven/bun:…)
    image: ${IMAGE_REGISTRY:-local}/xray-api:${IMAGE_TAG:?IMAGE_TAG 必须显式指定(git SHA),禁止 latest}
    restart: unless-stopped
    # 安全约束(docs/security.md 第 3 层):非 root、只读根 FS、无特权、无能力、限内存/进程数
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # R1 实测(Bun 口径):基座 ~162MB;事件缓冲结构性上限每会话最坏 ~56MB × 8 并发。
    # 1g 覆盖对抗性最坏仍有余量,同时把主机总预算压在 3.6GiB 物理内存内。
    # 上调依据见 docs/deploy-cn-lightweight.md §0 的容量公式,不要拍脑袋改。
    mem_limit: 1g
    pids_limit: 256
    environment:
      # 镜像默认监听 8080;这里显式对齐 Caddyfile 的 api:4000(二选一,已写死)
      - PORT=4000
      # 下列变量由 deploy/infra-config.json 以 {"$env": …} 引用,构建时已绑定
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?}
      # R6 落地 agent_ro 只读工具连接、R7 落地 admin/LLM 配置时,
      # 在 infra-config.json 的 secrets 段增声明后再在此处补对应变量。
      # 高危工具双闸之一(默认不设):XRAY_UNLOCK_DANGEROUS_TOOLS
    expose:
      - "4000"
    networks: [front, back]
    depends_on:
      postgres:
        condition: service_healthy
    # 必须 ≥ infra-config.json 的 graceful_shutdown.total(30s)+ 余量,
    # 否则 SSE 长连接会被 SIGKILL 硬断而不是走优雅关闭
    stop_grace_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # 库名必须是 agent:Encore infra-config 的 databases key 即物理库名
      - POSTGRES_DB=agent
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks: [back]
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agent"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  front:
  back:
    # 数据库只在内部网段可达:caddy/web 无法直接连 postgres
    internal: true

volumes:
  caddy_data:
  caddy_config:
  pg_data:
